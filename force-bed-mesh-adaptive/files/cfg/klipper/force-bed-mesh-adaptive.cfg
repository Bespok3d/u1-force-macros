[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
description: Force an adaptive bed mesh: probe only the bed area the model covers
gcode:
    {% set labelled_objects = printer.exclude_object.objects if "exclude_object" in printer else [] %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        SET_PRINT_PREFERENCES BED_LEVEL=1 FORCE=1
    {% endif %}
    {% if labelled_objects | length == 0 %}
        {action_respond_info("Force Adaptive Bed Mesh: this file carries no object outline, so the whole bed is being probed. Turn on Exclude Object (label objects) in your slicer.")}
    {% endif %}
    # ADAPTIVE=1 goes AFTER rawparams on purpose: Klipper parses an extended command's arguments into
    # a dict, so the last occurrence of a key wins. A slicer that sends ADAPTIVE=0, as OrcaSlicer's
    # stock U1 profile does, is overridden instead of obeyed. Forcing is what this plugin is for, and
    # _BED_MESH_CALIBRATE_BASE is still there for a deliberate full-bed probe.
    _BED_MESH_CALIBRATE_BASE {rawparams} ADAPTIVE=1
