[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
description: Force an adaptive bed mesh during a print: probe only the bed area the model covers
gcode:
    # Only a print is forced. Klipper keeps the last print's object outlines after it ends, so a mesh
    # run by hand to check the bed would otherwise shrink to where the previous model sat.
    {% set print_running = printer.print_stats.state in ["printing", "paused"] %}
    {% set labelled_objects = printer.exclude_object.objects if "exclude_object" in printer else [] %}
    {% if print_running %}
        SET_PRINT_PREFERENCES BED_LEVEL=1 FORCE=1
    {% endif %}
    {% if print_running and labelled_objects | length == 0 %}
        {action_respond_info("Force Adaptive Bed Mesh: this file carries no object outline, so the whole bed is being probed. Turn on Exclude Object (label objects) in your slicer.")}
    {% endif %}
    # During a print, ADAPTIVE=1 goes AFTER rawparams on purpose: Klipper parses an extended command's
    # arguments into a dict, so the last occurrence of a key wins. A slicer that sends ADAPTIVE=0, as
    # OrcaSlicer's stock U1 profile does, is overridden instead of obeyed. Forcing is what this plugin
    # is for, and _BED_MESH_CALIBRATE_BASE is still there for a deliberate full-bed probe mid-print.
    _BED_MESH_CALIBRATE_BASE {rawparams} {"ADAPTIVE=1" if print_running else ""}
